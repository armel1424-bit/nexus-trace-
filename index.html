<style>
/* NEXUS TRACE — parcours de décisions. Zones sombres immersives, zones claires pédagogiques. */
:root {
  --blue: #246BFD;
  --blue-d: #1B54CC;
  --night: #0A1229;
  --night-2: #111B3C;
  --night-3: #1A2750;
  --line: #2A3A6E;
  --ink: #0F172A;
  --ink-2: #475569;
  --bg: #F3F6FC;
  --card: #FFFFFF;
  --rule: #DCE3F1;
  --good: #0F7B4A;
  --good-bg: #E6F5EC;
  --bad: #B42318;
  --bad-bg: #FDECEA;
  --part: #9A5B00;
  --part-bg: #FFF4DC;
  --on-night: #E8EEFF;
  --on-night-2: #A9B7DC;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.55; font-size: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 0; background: var(--blue); color: #fff; padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; top: 8px; }
:focus-visible { outline: 3px solid #7FA8FF; outline-offset: 2px; }
.ico { width: 18px; height: 18px; vertical-align: -3px; }

/* ----- en-tête ----- */
.site-head { background: var(--night); color: var(--on-night); position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line); }
.head-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 9px; color: #fff; text-decoration: none; font-weight: 700; letter-spacing: .08em; font-size: 15px; }
.brand i { width: 12px; height: 12px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px rgba(36,107,253,.25); }
#progress { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 13px; color: var(--on-night-2); min-width: 0; }
#progress strong { color: #fff; }
.pg-bar { display: block; width: 130px; max-width: 100%; height: 6px; background: var(--night-3); border-radius: 4px; overflow: hidden; }
.pg-bar span { display: block; height: 100%; background: var(--blue); transition: width .4s; }

main { max-width: 760px; margin: 0 auto; padding-bottom: 48px; }
.eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #8FB0FF; font-weight: 600; }
.note { font-size: 13px; color: var(--ink-2); }

/* ----- accueil ----- */
.hero { background: linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%); color: var(--on-night); padding: 36px 20px 32px; }
.hero h1 { margin: 0; font-size: clamp(34px, 9vw, 52px); letter-spacing: .04em; line-height: 1.05; color: #fff; }
.tagline { margin: 10px 0 0; color: var(--on-night-2); font-size: 16px; }
.hook { margin: 26px 0 8px; font-size: clamp(21px, 5.6vw, 28px); font-weight: 650; color: #fff; line-height: 1.25; }
.lead { margin: 0 0 20px; color: var(--on-night); }
.hero-pg { display: inline-block; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.04); margin-bottom: 18px; font-size: 14px; }
.notice { background: rgba(36,107,253,.18); border: 1px solid var(--blue); padding: 10px 14px; border-radius: 10px; margin: 0 0 16px; }
.free-badge { color: #7BE0A8; margin: 0 0 14px; }
.how, .list { padding: 24px 20px 4px; }
.how h2, .list h2 { margin: 0 0 12px; font-size: 18px; }
.how-list { margin: 0 0 8px; padding-left: 20px; display: grid; gap: 6px; }
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.scard { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; min-height: 64px; }
.scard:hover:not(.locked) { border-color: var(--blue); }
.s-n { flex: 0 0 38px; height: 38px; border-radius: 50%; background: var(--night); color: #fff; display: grid; place-items: center; font-weight: 700; }
.s-t { flex: 1; display: grid; }
.s-t small { color: var(--ink-2); }
.s-i { color: var(--blue); font-size: 22px; }
.scard.done .s-n { background: var(--good); }
.scard.locked { opacity: .55; }
.scard.locked .s-n { background: #64748B; }

/* ----- boutons ----- */
.btn { border: 1px solid var(--rule); background: var(--card); border-radius: 10px; padding: 10px 16px; min-height: 44px; font-weight: 600; }
.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn.primary:hover:not(:disabled) { background: var(--blue-d); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { width: 100%; padding: 14px 18px; font-size: 17px; }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.mini { min-height: 38px; padding: 6px 12px; font-size: 14px; background: var(--night-3); color: var(--on-night); border-color: var(--line); }

/* ----- barre de scénarios ----- */
.topbar { background: var(--night); padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.back { align-self: flex-start; background: none; border: 0; color: var(--on-night-2); padding: 6px 0; min-height: 36px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--night-2); color: var(--on-night); font-weight: 700; display: grid; place-items: center; }
.chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.chip.done { border-color: #2f9e6a; color: #7BE0A8; }
.chip.locked { opacity: .5; color: var(--on-night-2); }

/* ----- carte de scénario ----- */
.sc-card { background: var(--night); color: var(--on-night); padding: 6px 20px 20px; }
.sc-title { margin: 0; font-size: clamp(26px, 7vw, 36px); line-height: 1.15; color: #fff; }
.sc-title:focus { outline: none; }
.sc-goal { margin: 8px 0 14px; color: var(--on-night-2); }
.loop { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.loop li { font-size: 11px; letter-spacing: .08em; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--on-night-2); }
.loop li.past { color: #fff; border-color: #3C5AA8; background: rgba(36,107,253,.2); }
.loop li.now { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }

/* ----- visualisation ----- */
.viz { background: var(--night-2); color: var(--on-night); padding: 0 20px 22px; border-top: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; padding-top: 14px; }
.tabs button { flex: 1; min-height: 42px; border: 1px solid var(--line); background: transparent; color: var(--on-night-2); letter-spacing: .08em; font-weight: 650; font-size: 13px; border-radius: 10px; }
.tabs button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.viz-q { margin: 14px 0 10px; color: var(--on-night-2); font-size: 14px; }
.scene .vlink { text-align: center; color: #5C7BCB; line-height: 1; margin: 4px 0; font-size: 18px; }
.blk { margin: 0; }
.blk-t { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #8FB0FF; margin-bottom: 6px; }
.blk-note { text-transform: none; letter-spacing: 0; color: var(--on-night-2); }
.nodes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.nodes.group { align-items: stretch; }
.node { position: relative; background: var(--night-3); border: 1.5px solid #3C5AA8; border-radius: 12px; padding: 9px 12px; min-width: 84px; display: grid; gap: 2px; flex: 0 1 auto; }
.nodes.group .node { flex: 1 1 110px; }
.n-l { font-weight: 650; font-size: 15px; color: #fff; padding-right: 14px; }
.n-s { font-size: 12.5px; color: var(--on-night-2); line-height: 1.3; }
.n-m { position: absolute; top: 5px; right: 8px; font-weight: 800; font-size: 14px; }
.node.st-down { border-color: #FF8A80; border-style: dashed; } .node.st-down .n-m { color: #FF8A80; }
.node.st-warn { border-color: #FFC857; } .node.st-warn .n-m { color: #FFC857; }
.node.st-new { border-color: #5FA2FF; background: #16336F; } .node.st-new .n-m { color: #8FC0FF; }
.arr { color: #7FA0F0; font-size: 18px; }
.arr.cut { color: #FF8A80; font-weight: 800; }
.scene.compact .node { padding: 7px 10px; }
.scene.compact .n-l { font-size: 14px; }

.trace { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tstep { display: flex; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--night-3); }
.tstep.on { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(36,107,253,.35); background: #16336F; }
.t-n { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--night); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
.tstep.on .t-n { background: var(--blue); }
.t-b { flex: 1; min-width: 0; }
.t-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: #fff; }
.t-k { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--on-night-2); }
.t-d { font-size: 14px; color: var(--on-night-2); margin-top: 2px; }
.t-bar { margin-top: 7px; display: flex; align-items: center; gap: 8px; }
.t-bar span { display: block; height: 8px; background: var(--blue); border-radius: 4px; flex: 0 1 auto; min-width: 4px; }
.t-bar em { font-style: normal; font-size: 13px; color: #fff; white-space: nowrap; }
.t-total { margin: 12px 0 0; font-size: 14px; color: var(--on-night); }
.t-total span { color: var(--on-night-2); font-size: 12.5px; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; color: var(--on-night-2); font-size: 14px; }

/* panneau « conséquence » (zone claire) : on réutilise les composants sombres dans une carte sombre */
.cons .scene, .cons .trace { background: var(--night-2); padding: 12px; border-radius: 14px; }
.cons .tstep { background: var(--night-3); }

/* ----- zone question ----- */
.qzone { padding: 22px 20px 0; }
.qcount { margin: 0 0 12px; font-size: 13px; color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.block { margin-bottom: 16px; }
.lab { display: inline-block; font-size: 11.5px; letter-spacing: .12em; font-weight: 700; color: var(--blue); margin-bottom: 4px; }
.situation { margin: 0; font-size: 17px; }
.ask { margin: 0; font-size: clamp(20px, 5.4vw, 24px); line-height: 1.25; }
.hint { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
.choices { display: grid; gap: 10px; margin-bottom: 14px; }
.choice { display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%; background: var(--card); border: 1.5px solid var(--rule); border-radius: 14px; padding: 14px; min-height: 56px; position: relative; }
.choice:hover:not(:disabled) { border-color: var(--blue); }
.choice.sel { border-color: var(--blue); background: #EAF1FF; }
.c-l { flex: 0 0 28px; height: 28px; border-radius: 8px; background: var(--night); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
[role="checkbox"] .c-l { background: transparent; border: 2px solid #94A3B8; border-radius: 6px; }
.choice.sel .c-l { border-color: var(--blue); background: var(--blue); }
.choice.sel[role="checkbox"] .c-l::after { content: "✓"; color: #fff; font-weight: 800; }
.c-t { flex: 1; }
.c-r { font-weight: 800; }
.choice.action { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 650; }
.choice.action .c-l { display: none; }
.choice:disabled { cursor: default; }
.choice.is-good { background: var(--good-bg); border-color: var(--good); }
.choice.is-bad { background: var(--bad-bg); border-color: var(--bad); }
.choice.is-part { background: var(--part-bg); border-color: var(--part); }
.choice.is-good .c-r { color: var(--good); } .choice.is-bad .c-r { color: var(--bad); }
.choice.action.is-good { background: var(--good-bg); color: var(--ink); }
#validate { width: 100%; }

/* ----- panneau POURQUOI ----- */
.why { background: var(--card); border: 1.5px solid var(--rule); border-left-width: 6px; border-radius: 14px; padding: 16px; margin: 18px 0 14px; }
.why:focus { outline: none; }
.why.good { border-left-color: var(--good); } .why.bad { border-left-color: var(--bad); } .why.part { border-left-color: var(--part); }
.why h3 { margin: 0 0 6px; font-size: 14px; letter-spacing: .14em; color: var(--blue); }
.verdict { display: inline-block; margin: 0 0 12px; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; }
.v-good { background: var(--good-bg); color: var(--good); } .v-bad { background: var(--bad-bg); color: var(--bad); } .v-part { background: var(--part-bg); color: var(--part); }
.w-sec { margin: 0 0 12px; }
.w-sec p { margin: 2px 0 0; }
.why-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; }
.why-list li { display: flex; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: 15px; }
.why-list .ok { background: var(--good-bg); } .why-list .ko { background: var(--bad-bg); }
.why-list .v { font-weight: 700; }
.cons { margin-top: 4px; }
.cons-t { margin: 10px 0 0; font-weight: 500; }
.done-card, .retry-card { margin: 12px 0; padding: 12px 14px; border-radius: 12px; }
.done-card { background: var(--good-bg); color: #0b5c37; }
.retry-card { background: var(--part-bg); color: var(--part); }

.foot { padding: 28px 20px 0; text-align: center; }
.warn-t { font-weight: 600; }

@media (min-width: 720px) {
  main { padding-bottom: 72px; }
  .hero, .sc-card, .viz, .qzone, .how, .list, .topbar { border-radius: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

</style>

<script>
/* NEXUS TRACE — noyau des données du parcours (utilisable aussi sous Node pour les tests) */
(function () {
  var root = typeof window !== 'undefined' ? window : globalThis;
  var NQ = root.NQ = root.NQ || {};
  NQ.scenarios = [];

  /* Nœud : id, étiquette, sous-titre, état (ok | warn | down | new | hot) */
  NQ.n = function (id, l, s, st) { return { id: id, l: l, s: s || '', st: st || 'ok' }; };
  /* Bloc de scène : mode 'chain' (nœuds reliés par des flèches) ou 'group' (nœuds en parallèle) */
  NQ.b = function (t, mode, nodes, o) { return Object.assign({ t: t, mode: mode, nodes: nodes }, o || {}); };
  /* Étape de trace : titre, détail, durée en ms (optionnelle), kind (reseau | serveur | client) */
  NQ.s = function (t, d, ms, kind) { return { t: t, d: d, ms: ms === undefined ? null : ms, kind: kind || '' }; };

  NQ.LOOP = ['OBSERVE', 'TRACE', 'COMPRENDS', 'MODIFIE', 'TESTE', 'EXPLIQUE'];
  NQ.STORE_KEY = 'nt.quiz.v1';
})();

/* NEXUS TRACE — scénarios 1 à 4 : situation, décision, explication, conséquence */
(function () {
  var NQ = (typeof window !== 'undefined' ? window : globalThis).NQ;
  var n = NQ.n, b = NQ.b, s = NQ.s;

  /* ================= 1. OUVRIR UNE PAGE (chapitre 7) ================= */
  var S1_SCENE = [
    b('Ton appareil', 'chain', [n('u', 'Toi'), n('nav', 'Navigateur')]),
    b('Annuaire', 'group', [n('dns', 'DNS', 'nom → adresse')]),
    b('Le voyage', 'chain', [n('net', 'Internet', 'routeurs'), n('srv', 'Serveur web', '203.0.113.7')]),
    b('Derrière le serveur', 'chain', [n('app', 'NEXUS DEMO', 'application'), n('db', 'Base de données', 'compteur')])
  ];
  var S1_TRACE = [
    s('Tu tapes nexus-demo.example', 'Le navigateur reçoit un nom, pas une adresse.', 0, 'client'),
    s('Le DNS donne l’adresse', 'Question puis réponse : 203.0.113.7.', 30, 'reseau'),
    s('La connexion s’établit', 'Poignée de main TCP : un aller-retour avant toute demande.', 40, 'reseau'),
    s('La demande part', 'GET /accueil, en HTTP.', 20, 'reseau'),
    s('Le serveur travaille', 'L’application lit le compteur dans la base et construit la page.', 60, 'serveur'),
    s('La réponse revient', 'La page repart en paquets.', 20, 'reseau'),
    s('Le navigateur affiche', 'Il assemble les morceaux et dessine la page.', 50, 'client')
  ];
  var S1_TRACE_BACK = [
    s('Tu tapes nexus-demo.example', 'Même nom, même site.', 0, 'client'),
    s('Adresse déjà en mémoire', 'Le cache DNS répond sans interroger l’annuaire.', 1, 'reseau'),
    s('Connexion réutilisée', 'Pas de nouvelle poignée de main complète.', 5, 'reseau'),
    s('La demande part', 'GET /accueil.', 20, 'reseau'),
    s('Le serveur travaille', 'Toujours le même travail : construire la page.', 60, 'serveur'),
    s('La réponse revient', 'La page repart en paquets.', 20, 'reseau'),
    s('Le navigateur affiche', 'Styles et images déjà gardés : affichage plus court.', 20, 'client')
  ];

  NQ.scenarios.push({
    id: 1, chapter: 7, title: 'Ouvrir une page',
    goal: 'Comprendre le trajet général d’une requête : de l’adresse tapée à la page affichée.',
    scene: S1_SCENE, trace: S1_TRACE,
    questions: [
      {
        kind: 'single',
        situation: 'Tu ouvres **nexus-demo.example**. La page s’affiche en un clin d’œil, mais derrière, la requête a traversé sept étapes. Observe la trace : le total fait **220 ms**.',
        ask: 'Où le temps se perd-il principalement ?',
        principle: 'Une visite est une conversation ordonnée. Chaque étape a un coût, et la seconde que tu ressens est une pile d’attentes courtes.',
        others: 'Chercher « le coupable » dans une seule étape est le réflexe le plus courant, et il est presque toujours faux : les temps s’additionnent.',
        choices: [
          { t: 'Dans une seule étape, sûrement le serveur', ok: false,
            why: 'Le serveur ne représente ici que 60 ms sur 220, soit environ un quart du temps.',
            change: 'Rien ne change : si on ne touchait que le serveur, on gagnerait au mieux 60 ms.' },
          { t: 'Il est réparti sur plusieurs étapes : réseau, serveur, navigateur', ok: true,
            why: 'Exact. Le réseau (DNS, connexion, demande, réponse) pèse 110 ms, le serveur 60 ms, le navigateur 50 ms. Aucune étape ne suffit à expliquer le total.',
            change: 'La trace se colore par couche : pour aller plus vite, on cherche d’abord quelles étapes on peut raccourcir ou éviter.',
            cons: 'Total : 220 ms = 110 ms de réseau + 60 ms de serveur + 50 ms d’affichage. Améliorer une seule couche ne suffit pas toujours.',
            outcome: { trace: S1_TRACE, focus: 'all' } },
          { t: 'Presque tout dans le DNS', ok: false,
            why: 'Le DNS ne prend ici que 30 ms. Il est indispensable, mais il n’est pas l’étape la plus longue.',
            change: 'Rien ne change : l’annuaire n’est qu’une étape parmi sept.' },

    steps.forEach(function (st, i) {
      var on = pointer && i === active;
      out += '<li class="tstep' + (on ? ' on' : '') + '"' + (on ? ' aria-current="step"' : '') + '>' +
        '<span class="t-n">' + (i + 1) + '</span><div class="t-b"><div class="t-h"><strong>' + esc(st.t) + '</strong>' +
        (st.kind ? '<span class="t-k k-' + st.kind + '">' + KIND[st.kind] + '</span>' : '') + '</div>' +
        '<div class="t-d">' + esc(st.d) + '</div>' +
        (st.ms !== null ? '<div class="t-bar"><span style="width:' + Math.max(2, st.ms / max * 100) + '%"></span><em>' + st.ms + ' ms</em></div>' : '') +
        '</div></li>';
    });
    out += '</ol>';
    if (hasMs) out += '<p class="t-total">Total simulé : <strong>' + total + ' ms</strong> <span>(ordres de grandeur pédagogiques)</span></p>';
    return out;
  }

  /* ---------- écran d’accueil ---------- */
  function renderHome(notice) {
    cur = null;
    var d = doneCount(), todo = nextTodo();
    var h = '';
    h += '<section class="hero">';
    h += '<p class="eyebrow">DIGITAL MINDS 04 · NEXUS</p>';
    h += '<h1>NEXUS TRACE</h1>';
    h += '<p class="tagline">Voir ce qui se passe réellement derrière une connexion</p>';
    h += '<p class="hook">« J’ouvre un site. Trace ce qui se passe. »</p>';
    h += '<p class="lead">8 scénarios. 8 décisions. Une infrastructure qui évolue avec tes choix.</p>';
    h += '<div class="hero-pg"><strong>' + d + ' / ' + TOTAL + '</strong> scénarios maîtrisés' + (d ? ' · maîtrise immédiate : ' + firstCount() + ' / ' + d : '') + '</div>';
    if (notice) h += '<p class="notice" role="status">' + esc(notice) + '</p>';
    if (allDone()) h += '<p class="free-badge">Mode libre déverrouillé : rejoue n’importe quel scénario.</p>';
    h += '<button class="btn primary big" id="start">' + (allDone() ? 'Rejouer depuis le début' : d ? 'Reprendre au scénario ' + todo : 'Commencer') + '</button>';
    h += '</section>';
    h += '<section class="how"><h2>Comment ça marche</h2><ol class="how-list">' +
      '<li><b>Situation.</b> Tu vois une infrastructure et un problème.</li>' +
      '<li><b>Décision.</b> Tu choisis. Aucun risque : une mauvaise réponse explique, puis tu réessaies.</li>' +
      '<li><b>Pourquoi.</b> Chaque réponse est expliquée, avec ce qui change dans l’architecture.</li></ol>' +
      '<p class="note">Tout est simulé dans ton navigateur. Aucun compte, aucune donnée envoyée. Ta progression reste sur cet appareil.</p></section>';
    h += '<section class="list"><h2>Les 8 scénarios</h2><ol class="cards">';
    SC.forEach(function (s) {
      var lock = !unlocked(s.id), dn = !!saved.done[s.id];
      h += '<li><button class="scard' + (dn ? ' done' : '') + (lock ? ' locked' : '') + '" data-open="' + s.id + '"' + (lock ? ' aria-disabled="true"' : '') + '>' +
        '<span class="s-n">' + s.id + '</span><span class="s-t"><strong>' + esc(s.title) + '</strong><small>Chapitre ' + s.chapter + (lock ? ' · verrouillé' : dn ? ' · maîtrisé' : '') + '</small></span>' +
        '<span class="s-i">' + (lock ? LOCK : dn ? CHECK : '›') + '</span></button></li>';
    });
    h += '</ol></section>';
    h += resetBlock();
    app.innerHTML = h;
    document.title = 'NEXUS TRACE — Voir ce qui se passe réellement derrière une connexion';
    wireCommon();
    document.getElementById('start').addEventListener('click', function () { go(allDone() ? 1 : todo); });
    window.scrollTo(0, 0);
  }

  function resetBlock() {
    return '<footer class="foot"><div id="resetZone"><button class="btn ghost" id="resetAsk">Réinitialiser ma progression</button></div>' +
      '<p class="note">Progression gardée uniquement dans ce navigateur (localStorage). Rien n’est envoyé.</p></footer>';
  }

  function wireCommon() {
    Array.prototype.forEach.call(app.querySelectorAll('[data-open]'), function (b) {
      b.addEventListener('click', function () { go(+b.getAttribute('data-open')); });
    });
    var ask = document.getElementById('resetAsk');
    if (ask) ask.addEventListener('click', function () {
      var z = document.getElementById('resetZone');
      z.innerHTML = '<p class="warn-t">Effacer toute ta progression sur cet appareil ?</p><button class="btn danger" id="resetYes">Oui, tout effacer</button> <button class="btn ghost" id="resetNo">Annuler</button>';
      document.getElementById('resetYes').addEventListener('click', function () { reset(); renderProgress(); if (location.hash) history.replaceState(null, '', location.pathname); renderHome('Progression effacée.'); });
      document.getElementById('resetNo').addEventListener('click', function () { z.innerHTML = '<button class="btn ghost" id="resetAsk2">Réinitialiser ma progression</button>'; document.getElementById('resetAsk2').addEventListener('click', function () { wireCommonReset(); }); wireCommonReset(); });
    });
  }
  function wireCommonReset() { route(); }

  /* ---------- navigation ---------- */
  function go(id) {
    if (location.hash !== '#scenario-' + id) { location.hash = '#scenario-' + id; } else { route(); }
  }
  function route() {
    var m = /^#scenario-(\d+)$/.exec(location.hash);
    if (!m) { renderHome(); return; }
    var id = +m[1];
    if (id < 1 || id > TOTAL) { renderHome(); return; }
    if (!unlocked(id)) {
      var t = nextTodo();
      renderHome('Le scénario ' + id + ' se débloque après la validation du scénario ' + (id - 1) + '. Reprends au scénario ' + t + '.');
      return;
    }
    openScenario(id);
  }

  /* ---------- écran de scénario ---------- */
  function openScenario(id) {
    cur = { id: id, qi: 0, answered: false, result: null, clean: true, tried: [], sel: [], tab: 'arch', step: 0 };
    renderScenario();
    window.scrollTo(0, 0);
  }

  function navChips() {
    var h = '<nav class="chips" aria-label="Scénarios">';
    SC.forEach(function (s) {
      var lock = !unlocked(s.id), on = cur && cur.id === s.id, dn = !!saved.done[s.id];
      h += '<button class="chip' + (on ? ' on' : '') + (dn ? ' done' : '') + (lock ? ' locked' : '') + '" data-open="' + s.id + '"' + (on ? ' aria-current="true"' : '') + (lock ? ' aria-disabled="true"' : '') +
        ' aria-label="Scénario ' + s.id + (lock ? ' verrouillé' : dn ? ' maîtrisé' : '') + '">' + (lock ? LOCK : dn && !on ? CHECK : s.id) + '</button>';
    });
    return h + '</nav>';
  }

  function loopStrip() {
    var active = cur.answered ? 5 : 3;
    var h = '<ol class="loop" aria-label="Boucle d’apprentissage">';
    NQ.LOOP.forEach(function (w, i) { h += '<li class="' + (i < active ? 'past' : i === active ? 'now' : '') + '"' + (i === active ? ' aria-current="step"' : '') + '>' + w + '</li>'; });
    return h + '</ol>';
  }

  function renderScenario() {
    var s = byId(cur.id), q = s.questions[cur.qi];
    var multi = q.kind === 'multi';
    var h = '';
    h += '<div class="topbar"><button class="back" id="back">← Parcours</button>' + navChips() + '</div>';
    h += '<section class="sc-card"><p class="eyebrow">Scénario ' + s.id + ' / ' + TOTAL + ' · chapitre ' + s.chapter + (allDone() ? ' · mode libre' : '') + '</p>' +
      '<h1 class="sc-title" tabindex="-1" id="scTitle">' + esc(s.title) + '</h1><p class="sc-goal">' + esc(s.goal) + '</p>' + loopStrip() + '</section>';

    var scene = s.scene, trace = s.trace;
    h += '<section class="viz" aria-label="Visualisation de l’infrastructure"><div class="tabs" role="tablist">' +
      '<button role="tab" id="tabArch" aria-selected="' + (cur.tab === 'arch') + '" aria-controls="panArch" class="' + (cur.tab === 'arch' ? 'on' : '') + '">ARCHITECTURE</button>' +
      '<button role="tab" id="tabTrace" aria-selected="' + (cur.tab === 'trace') + '" aria-controls="panTrace" class="' + (cur.tab === 'trace' ? 'on' : '') + '">TRACE</button></div>' +
      '<div id="panArch" role="tabpanel" aria-labelledby="tabArch"' + (cur.tab === 'arch' ? '' : ' hidden') + '><p class="viz-q">Qui parle à qui ? Quels composants existent ?</p>' + sceneHTML(scene) + '</div>' +
      '<div id="panTrace" role="tabpanel" aria-labelledby="tabTrace"' + (cur.tab === 'trace' ? '' : ' hidden') + '><p class="viz-q">Le trajet de la requête, étape par étape.</p>' +
      '<div id="traceBody">' + traceHTML(trace, cur.step, true) + '</div>' +
      '<div class="stepper"><button class="btn mini" id="prevStep" aria-label="Étape précédente">‹ Précédente</button><span id="stepInfo">Étape ' + (cur.step + 1) + ' / ' + trace.length + '</span><button class="btn mini" id="nextStep" aria-label="Étape suivante">Suivante ›</button></div></div></section>';

    h += '<section class="qzone">';
    if (s.questions.length > 1) h += '<p class="qcount">Question ' + (cur.qi + 1) + ' sur ' + s.questions.length + '</p>';
    h += '<div class="block"><span class="lab">SITUATION</span><p class="situation">' + fmt(q.situation) + '</p></div>';
    h += '<div class="block"><span class="lab">DÉCISION</span><h2 class="ask" id="ask">' + esc(q.ask) + '</h2>' + (multi ? '<p class="hint">Plusieurs réponses possibles.</p>' : '') + '</div>';
    h += '<div class="choices" role="' + (multi ? 'group' : 'group') + '" aria-labelledby="ask" id="choices">';
    q.choices.forEach(function (c, i) {
      var L = String.fromCharCode(65 + i);
      h += '<button class="choice' + (q.kind === 'action' ? ' action' : '') + '" data-i="' + i + '"' + (multi ? ' role="checkbox" aria-checked="false"' : '') + '><span class="c-l">' + (multi ? '' : L) + '</span><span class="c-t">' + esc(c.t) + '</span></button>';
    });
    h += '</div>';
    if (multi) h += '<button class="btn primary" id="validate" disabled>Valider ma sélection</button>';
    h += '<div id="result" aria-live="polite"></div>';
    h += '</section>';
    h += resetBlock();
    app.innerHTML = h;
    document.title = 'Scénario ' + s.id + ' — ' + s.title + ' · NEXUS TRACE';
    wireCommon();
    wireScenario(q);
  }

  function wireScenario(q) {
    var s = byId(cur.id);
    document.getElementById('back').addEventListener('click', function () { location.hash = ''; history.replaceState(null, '', location.pathname); route(); });
    function setTab(t) {
      cur.tab = t;
      document.getElementById('tabArch').setAttribute('aria-selected', t === 'arch');
      document.getElementById('tabTrace').setAttribute('aria-selected', t === 'trace');
      document.getElementById('tabArch').classList.toggle('on', t === 'arch');
      document.getElementById('tabTrace').classList.toggle('on', t === 'trace');
      document.getElementById('panArch').hidden = t !== 'arch';
      document.getElementById('panTrace').hidden = t !== 'trace';
    }
    document.getElementById('tabArch').addEventListener('click', function () { setTab('arch'); });
    document.getElementById('tabTrace').addEventListener('click', function () { setTab('trace'); });
    function showStep() {
      document.getElementById('traceBody').innerHTML = traceHTML(s.trace, cur.step, true);
      document.getElementById('stepInfo').textContent = 'Étape ' + (cur.step + 1) + ' / ' + s.trace.length;
    }
    document.getElementById('prevStep').addEventListener('click', function () { if (cur.step > 0) { cur.step--; showStep(); } });
    document.getElementById('nextStep').addEventListener('click', function () { if (cur.step < s.trace.length - 1) { cur.step++; showStep(); } });

    var btns = Array.prototype.slice.call(document.querySelectorAll('#choices .choice'));
    if (q.kind === 'multi') {
      var validate = document.getElementById('validate');
      btns.forEach(function (bt) {
        bt.addEventListener('click', function () {
          if (cur.answered) return;
          var on = bt.classList.toggle('sel');
          bt.setAttribute('aria-checked', on);
          validate.disabled = !btns.some(function (x) { return x.classList.contains('sel'); });
        });
      });
      validate.addEventListener('click', function () {
        if (cur.answered) return;
        var sel = btns.map(function (x) { return x.classList.contains('sel'); });
        answerMulti(q, sel, btns);
      });
    } else {
      btns.forEach(function (bt) {
        bt.addEventListener('click', function () { if (!cur.answered) answerSingle(q, +bt.getAttribute('data-i'), btns); });
      });
    }
  }

  /* ---------- réponses ---------- */
  function verdictOf(ok) { return ok === true ? 'good' : ok === 'part' ? 'part' : 'bad'; }
  var VERDICT_TXT = { good: 'Bonne logique', part: 'Partiellement juste', bad: 'Pas tout à fait' };

  function answerSingle(q, i, btns) {
    var c = q.choices[i], v = verdictOf(c.ok);
    cur.answered = true; cur.result = v;
    btns.forEach(function (b, k) { b.disabled = true; b.classList.toggle('picked', k === i); });
    btns[i].classList.add('is-' + v);
    if (v !== 'good') cur.clean = false;
    var html = panel(v, '<p>' + fmt(c.why) + '</p>', q, c.change, consequence(c.cons || c.change, c.outcome, v));
    finishAnswer(q, v, html);
  }

  function answerMulti(q, sel, btns) {
    var allOk = q.choices.every(function (c, k) { return !!c.ok === sel[k]; });
    var v = allOk ? 'good' : 'bad';
    cur.answered = true; cur.result = v;
    btns.forEach(function (b, k) {
      b.disabled = true;
      var c = q.choices[k], right = !!c.ok === sel[k];
      b.classList.add(right ? 'is-good' : 'is-bad');
      var tag = document.createElement('span'); tag.className = 'c-r';
      tag.textContent = right ? '✓' : '✕'; b.appendChild(tag);
    });
    document.getElementById('validate').hidden = true;
    if (v !== 'good') cur.clean = false;
    var why = '<ul class="why-list">' + q.choices.map(function (c, k) {
      var right = !!c.ok === sel[k];
      var verb = c.ok ? (sel[k] ? 'Bien vu : à mettre en cache / à repérer.' : 'Oublié : il fallait le sélectionner.') : (sel[k] ? 'À ne pas sélectionner.' : 'Bien vu : à laisser de côté.');
      return '<li class="' + (right ? 'ok' : 'ko') + '"><span aria-hidden="true">' + (right ? '✓' : '✕') + '</span><div><strong>' + esc(c.t) + '</strong><br><span class="v">' + verb + '</span> ' + esc(c.why) + '</div></li>';
    }).join('') + '</ul>';
    var change = allOk ? q.okCons : q.badCons;
    var outcome = allOk ? q.outcomeOk : null;
    finishAnswer(q, v, panel(v, why, q, change, consequence(change, outcome, v)));
  }

  function consequence(text, outcome, v) {
    var h = '<div class="block cons"><span class="lab">CONSÉQUENCE</span>';
    if (outcome && outcome.scene) h += sceneHTML(outcome.scene, true);
    if (outcome && outcome.trace) h += traceHTML(outcome.trace, 0, false);
    return h + '<p class="cons-t">' + fmt(text) + '</p></div>';
  }

  function panel(v, whyHTML, q, change, consHTML) {
    var h = '<section class="why ' + v + '" id="why" tabindex="-1" aria-label="Explication">';
    h += '<h3>POURQUOI ?</h3><p class="verdict v-' + v + '">' + VERDICT_TXT[v] + '</p>';
    h += '<div class="w-sec"><span class="lab">1 · Explication</span>' + whyHTML + '</div>';
    h += '<div class="w-sec"><span class="lab">2 · Principe NEXUS</span><p>' + fmt(q.principle) + '</p></div>';
    h += '<div class="w-sec"><span class="lab">3 · Ce qui change dans l’architecture</span><p>' + fmt(change || 'Rien ne change dans l’architecture.') + '</p></div>';
    if (q.others) h += '<div class="w-sec"><span class="lab">4 · Et les autres choix ?</span><p>' + fmt(q.others) + '</p></div>';
    return h + '</section>' + consHTML;
  }

  function finishAnswer(q, v, html) {
    var s = byId(cur.id);
    var last = cur.qi === s.questions.length - 1;
    var h = html;
    if (v === 'good') {
      if (last) {
        completeScenario();
        var nxt = cur.id < TOTAL ? cur.id + 1 : null;
        h += '<div class="done-card" role="status"><strong>Scénario ' + s.id + ' maîtrisé' + (cur.clean ? ' du premier coup' : '') + '.</strong> ' +
          (nxt ? 'Le scénario ' + nxt + ' est déverrouillé.' : 'Tu as terminé les 8 scénarios : le mode libre est déverrouillé.') + '</div>';
        h += nxt ? '<button class="btn primary big" id="cont">CONTINUER · scénario ' + nxt + ' →</button>' : '<button class="btn primary big" id="cont">TERMINER LE PARCOURS</button>';
      } else {
        h += '<button class="btn primary big" id="cont">CONTINUER →</button>';
      }
    } else {
      h += '<div class="retry-card">Pas de pénalité : ta progression est conservée.</div><button class="btn primary big" id="retry">RÉESSAYER</button>';
    }
    var r = document.getElementById('result');
    r.innerHTML = h;
    renderProgress();
    var loop = document.querySelector('.loop');
    if (loop) { var li = loop.querySelectorAll('li'); for (var k = 0; k < li.length; k++) li[k].className = k < 5 ? 'past' : 'now'; }
    var w = document.getElementById('why'); if (w) { w.focus({ preventScroll: true }); w.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    var cont = document.getElementById('cont'), retry = document.getElementById('retry');
    if (cont) cont.addEventListener('click', function () {
      if (!last) { cur.qi++; cur.answered = false; cur.result = null; cur.step = 0; renderScenario(); window.scrollTo(0, 0); }
      else if (cur.id < TOTAL) go(cur.id + 1);
      else { location.hash = ''; history.replaceState(null, '', location.pathname); route(); }
    });
    if (retry) retry.addEventListener('click', function () { cur.answered = false; cur.result = null; renderScenario(); document.getElementById('ask').scrollIntoView({ block: 'center' }); });
  }

  function completeScenario() {
    var id = cur.id;
    if (!saved.done[id]) { saved.done[id] = true; saved.first[id] = !!cur.clean; save(); }
    /* rafraîchit la navigation : le scénario suivant se déverrouille aussitôt */
    var nav = document.querySelector('.chips');
    if (nav) {
      nav.outerHTML = navChips();
      Array.prototype.forEach.call(document.querySelectorAll('.chips [data-open]'), function (b) {
        b.addEventListener('click', function () { go(+b.getAttribute('data-open')); });
      });
    }
  }

  /* ---------- démarrage ---------- */
  load();
  renderProgress();
  window.addEventListener('hashchange', route);
  document.getElementById('brand').addEventListener('click', function (e) { e.preventDefault(); history.replaceState(null, '', location.pathname); route(); });
  route();
})();

</script>
</body>
</html>
